name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Maven / JUnit / Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: JDK 17 のセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Testcontainersが実PostgreSQLコンテナを起動するため、Dockerが利用可能な
      # ubuntu-latestランナー上でmvn testを実行する（真の結合テストを含む）。
      - name: mvn test の実行（単体テスト＋Testcontainers結合テスト）
        working-directory: backend
        run: mvn -B test

      - name: テスト結果のアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        working-directory: frontend
        run: npm ci

      - name: 型チェック
        working-directory: frontend
        run: node ./node_modules/typescript/bin/tsc -b

      - name: Vitest の実行
        working-directory: frontend
        run: npm test
