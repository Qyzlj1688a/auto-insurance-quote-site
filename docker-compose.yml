services:
  db:
    image: postgres:16
    container_name: quote-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quote_db}
      POSTGRES_USER: ${POSTGRES_USER:-quote_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quote_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quote_user} -d ${POSTGRES_DB:-quote_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: quote-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-quote_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quote_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quote_pass}
      SERVER_PORT: 8080
      # JWT_SECRETはリポジトリに直接コミットしない。".env"ファイル（.env.exampleを
      # コピーして作成、.gitignore対象）から読み込む。未設定の場合は空文字となり、
      # 起動時にJWT署名検証が正しく機能しないため、必ず設定すること。
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: quote-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"

volumes:
  postgres-data:
