spring:
  application:
    name: quote-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quote_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:T&S_Auto_Insurance_Secret_Key_2026_06_25}
    expiration-ms: 7200000 # 2 hours
  login-lockout:
    # 同一ログインIDでの連続ログイン失敗がこの回数に達するとロックする（ブルートフォース対策）
    max-failed-attempts: 5
    # ロック時間（分）。この間は正しい資格情報でもログイン不可となる
    lockout-minutes: 15
  cors:
    # フロントエンドの許可オリジン（カンマ区切りで複数指定可）。次-3対応。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.quote: INFO
